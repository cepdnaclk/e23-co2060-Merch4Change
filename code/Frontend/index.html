<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Poppins font-->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>antigravity</title>

    <!--
      Apply the saved theme/font-size BEFORE React mounts and BEFORE the
      stylesheet paints, so we never flash the wrong theme on load.
      Keep this in sync with the keys used in src/context/ThemeContext.jsx.
    -->
    <script>
      (function () {
        try {
          var THEME_KEY = "m4c-theme";
          var FONT_KEY = "m4c-font-size";
          var theme = localStorage.getItem(THEME_KEY) || "system";
          var systemDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = theme === "system" ? (systemDark ? "dark" : "light") : theme;

          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.setAttribute(
            "data-font-size",
            localStorage.getItem(FONT_KEY) || "medium"
          );
        } catch (e) {
          // localStorage unavailable (privacy mode etc.) — fall back to light/medium defaults.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
